name: dashboard-image

# LIVE-01 / ANA-41: builds the production image of apps/dashboard on amd64, proves the access gate inside the real
# container, extracts its /app as the native bundle for hosts without Docker, proves the same gate with that bundle
# under Node 24, and keeps both as the workflow artifact ana-dashboard-<sha>. This is the app side of the release
# contract in deploy/ana-dashboard/README.md; the only host is the Contabo VPS vmi3693936 (ADR-ANA-001 v3).
# <sha> is OUT_ID below. Release only artifacts of push runs on main: a pull_request run is named pr-<PR head>, any
# other non-release run test-<sha>; both are test evidence kept 3 days, never a release (deploy/fetch-release.sh and
# release.sh check the run's event, branch and commit, not just the name).
# No registry, no secrets, no deploy step.
# Keep the push and pull_request path lists identical.
on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "deploy/ana-dashboard/**"
      - "deploy/fetch-release.sh"
      - "deploy/test-release-provenance.sh"
      - ".github/workflows/dashboard-image.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "deploy/ana-dashboard/**"
      - "deploy/fetch-release.sh"
      - "deploy/test-release-provenance.sh"
      - ".github/workflows/dashboard-image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # the commit every job checks out, tests and names its outputs after: the PR head on pull_request (not GitHub's test
  # merge with the base), the pushed commit on push and workflow_dispatch. A PR run therefore does not test the merge
  # result; that the head contains the current base is checked at merge readiness (docs/delivery/DRS.md).
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # names every bundle, image tag and artifact: the bare <SOURCE_SHA> only on a push to main (a release candidate),
  # pr-<SOURCE_SHA> on pull_request and test-<SOURCE_SHA> on any other run (workflow_dispatch on any branch). The step
  # "Output name matches the event" asserts this at run time; deploy/test-release-provenance.sh pins this line.
  # release.sh takes a bare 40-hex commit AND checks the bundle's .ana-build (event push, ref main, that commit).
  OUT_ID: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && github.sha || format('{0}-{1}', github.event_name == 'pull_request' && 'pr' || 'test', github.event.pull_request.head.sha || github.sha) }}
  # artifact retention: 14 days for release candidates (push to main), 3 days for test output (quota, 2026-10-31;
  # 30 → 14 on 2026-11-03 after the storage quota stopped every upload; the host keeps its own releases for rollback)
  RETENTION_DAYS: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 14 || 3 }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Checked-out commit is SOURCE_SHA
        shell: bash
        run: |
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo "FAIL: HEAD is $(git rev-parse HEAD), expected $SOURCE_SHA"; exit 1; }
          echo "source $SOURCE_SHA tree $(git rev-parse 'HEAD^{tree}')"
      - name: Output name matches the event
        shell: bash
        run: |
          # canary for release-shaped names: only a push to main may name its outputs with a bare 40-hex commit
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            [ "$OUT_ID" = "$SOURCE_SHA" ] && [[ "$OUT_ID" =~ ^[0-9a-f]{40}$ ]] || { echo "FAIL: push to main, OUT_ID '$OUT_ID'"; exit 1; }
            [ "$RETENTION_DAYS" = 14 ] || { echo "FAIL: release retention $RETENTION_DAYS"; exit 1; }
          else
            if [[ "$OUT_ID" =~ ^[0-9a-f]{40}$ ]]; then echo "FAIL: $GITHUB_EVENT_NAME on $GITHUB_REF has the release-shaped name $OUT_ID"; exit 1; fi
            [[ "$OUT_ID" =~ ^(pr|test)-[0-9a-f]{40}$ && "$OUT_ID" == *"-$SOURCE_SHA" ]] || { echo "FAIL: OUT_ID '$OUT_ID'"; exit 1; }
            [ "$RETENTION_DAYS" = 3 ] || { echo "FAIL: test-output retention $RETENTION_DAYS"; exit 1; }
          fi
          echo "event $GITHUB_EVENT_NAME ref $GITHUB_REF -> outputs $OUT_ID, retention $RETENTION_DAYS days"
      - name: Build
        run: docker build --platform linux/amd64 -t "ana-dashboard:${OUT_ID}" apps/dashboard
      - name: Image health check budget
        shell: bash
        run: |
          set -euo pipefail
          docker inspect -f '{{json .Config.Healthcheck}}' "ana-dashboard:${OUT_ID}" \
            | jq -e '.Timeout == 20000000000 and .StartPeriod == 90000000000 and .Interval == 30000000000 and .Retries == 3'
      - name: Contabo units and release.sh (lint)
        shell: bash
        run: |
          set -euo pipefail
          # README section 4: the implementation on the Contabo VPS vmi3693936. CI lints these files, not the host; it
          # cannot see what is installed there. Each check proves only what its message says; any other change to these
          # files is reviewed by hand against README section 1.
          u=deploy/ana-dashboard/dyai-ana-dashboard.service t=deploy/ana-dashboard/dyai-ana-tunnel.service
          r=deploy/ana-dashboard/release.sh
          fail() { echo "FAIL: $*"; exit 1; }
          for f in "$u" "$t" "$r"; do [ -f "$f" ] || fail "$f is missing (a renamed file must be renamed here too)"; done
          # (`! cmd` would not trip set -e, hence the explicit ifs)
          # dashboard unit: the settings the native-bundle step below also starts with, pinned in exactly these two
          # Environment= lines (they win over node --env-file); no EnvironmentFile=, UnsetEnvironment=, PassEnvironment=
          # or further Environment= lines; secrets only as a credential file; no MemoryDenyWriteExecute for node (V8
          # aborts). HOME and the node path are pinned only so that a change to them is reviewed.
          grep -qx 'Environment=NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 HOSTNAME=127.0.0.1 PORT=3410' "$u" || fail "dashboard: bind settings changed"
          grep -qx 'Environment=ANA_ACCESS_MODE=cloudflare ANA_CONTAINER=1 HOME=/run/dyai/ana-dashboard' "$u" || fail "dashboard: access settings changed"
          grep -qx 'ExecStart=/usr/bin/node --env-file=%d/dashboard_env server.js' "$u" || fail "dashboard: ExecStart changed"
          if grep -qE '^[[:space:]]*(EnvironmentFile|UnsetEnvironment|PassEnvironment)[[:space:]]*=' "$u"; then fail "dashboard: EnvironmentFile=, UnsetEnvironment= or PassEnvironment= could override or drop the pinned settings"; fi
          # exactly the two pinned lines: a later Environment= line could override or reset them
          [ "$(grep -cE '^[[:space:]]*Environment[[:space:]]*=' "$u")" = 2 ] || fail "dashboard: unexpected Environment= lines"
          [ "$(grep -cE '^[^#]*(HOSTNAME|ANA_ACCESS_MODE|ANA_CONTAINER)=' "$u")" = 2 ] || fail "dashboard: access settings set more than once"
          # exactly the pinned ExecStart=: an empty ExecStart= reset followed by another command would replace it
          [ "$(grep -cE '^[[:space:]]*ExecStart[[:space:]]*=' "$u")" = 1 ] || fail "dashboard: more than one ExecStart= line"
          if grep -qE '^[[:space:]]*MemoryDenyWriteExecute[[:space:]]*=' "$u"; then fail "dashboard: MemoryDenyWriteExecute aborts V8"; fi
          if grep -qiE '^[[:space:]]*Environment[[:space:]]*=.*(TOKEN|KEY|AUD|EMAIL)' "$u" "$t"; then fail "secret-like Environment= line"; fi
          # tunnel unit: how cloudflared is invoked is not linted here. Checked only: the unit reads its token from its
          # systemd credential, keeps its settings in the unit, and serves metrics where release.sh polls them
          grep -qE '^[[:space:]]*LoadCredential[[:space:]]*=[[:space:]]*tunnel_token:' "$t" || fail "tunnel: no LoadCredential=tunnel_token:"
          grep -qE '^[[:space:]]*ExecStart[[:space:]]*=.*--token-file[[:space:]=]+%d/tunnel_token([[:space:]]|$)' "$t" || fail "tunnel: unit does not read its token from %d/tunnel_token"
          if grep -qE '^[[:space:]]*EnvironmentFile[[:space:]]*=' "$t"; then fail "tunnel: EnvironmentFile= (the unit keeps every setting visible in the unit)"; fi
          grep -qF 'http://127.0.0.1:20242/ready' "$r" || fail "release.sh no longer polls 127.0.0.1:20242"
          grep -qE '^[[:space:]]*ExecStart[[:space:]]*=.*--metrics[[:space:]=]+127\.0\.0\.1:20242([[:space:]]|$)' "$t" || fail "tunnel: metrics not on 127.0.0.1:20242, where release.sh polls"
          bash -n "$r"
      - name: Release provenance (only a push run on main is releasable; canaries for release-shaped PR names)
        shell: bash
        run: deploy/test-release-provenance.sh
      - name: Access gate inside the container
        shell: bash
        run: |
          set -euo pipefail
          AUD=$(printf 'a%.0s' $(seq 64))
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $2" "http://127.0.0.1:$1$3"; }
          wait_healthy() { for _ in $(seq 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$1")" = healthy ] && return 0; sleep 2; done; docker logs "$1"; return 1; }
          expect() { [ "$1" = "$2" ] || { echo "FAIL: $3 -> $1, expected $2"; exit 1; }; echo "ok: $3 -> $1"; }

          # the image without any Access settings: everything refused, even a spoofed loopback Host
          docker run -d --name bare -p 127.0.0.1:3001:3000 "ana-dashboard:${OUT_ID}"
          wait_healthy bare
          for host in localhost 127.0.0.1 ana.dyai.cloud; do
            expect "$(code 3001 "$host" /)" 503 "no Access settings, Host $host, page"
            expect "$(code 3001 "$host" /api/social/instagram)" 503 "no Access settings, Host $host, social API"
          done

          # cloudflare mode under hardened container constraints (read-only root, no capabilities, init)
          docker run -d --name cf -p 127.0.0.1:3002:3000 --init --read-only --tmpfs /tmp --tmpfs /app/.next/cache \
            --cap-drop ALL --security-opt no-new-privileges:true -e ANA_ACCESS_MODE=cloudflare \
            -e CF_ACCESS_TEAM_DOMAIN=https://ci.cloudflareaccess.com -e CF_ACCESS_AUD="$AUD" -e ANA_ALLOWED_EMAILS=a@example.test \
            "ana-dashboard:${OUT_ID}"
          wait_healthy cf
          for p in / /pulse/social/instagram /api/social/instagram /api/work; do
            expect "$(code 3002 localhost "$p")" 401 "cloudflare mode, no assertion, $p"
          done
          expect "$(code 3002 localhost /api/healthz)" 200 "health check"
          expect "$(docker exec cf node -e 'process.stdout.write(require("fs").readFileSync("/proc/1/cmdline","utf8").split("\0")[0])')" /sbin/docker-init "PID 1 under --init"

          # any mode other than cloudflare is refused inside the container (it listens on all interfaces)
          port=3003
          for mode in open "" loopback; do
            docker run -d --name "mode$port" -p "127.0.0.1:$port:3000" -e "ANA_ACCESS_MODE=$mode" "ana-dashboard:${OUT_ID}"
            wait_healthy "mode$port"
            expect "$(code "$port" localhost /)" 503 "ANA_ACCESS_MODE='$mode', spoofed loopback Host, page"
            expect "$(code "$port" localhost /api/social/instagram)" 503 "ANA_ACCESS_MODE='$mode', spoofed loopback Host, social API"
            port=$((port + 1))
          done

          docker inspect -f '{{.Config.User}}' "ana-dashboard:${OUT_ID}" | grep -qx node
          docker rm -f bare cf mode3003 mode3004 mode3005
      - name: Native bundle for the Contabo host
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker create "ana-dashboard:${OUT_ID}")"
          mkdir bundle && docker cp "$cid:/app/." bundle/ && docker rm "$cid"
          # provenance, checked by release.sh (covered by the .sha256): which run built this bundle, for which commit
          printf '%s\n' "repository=$GITHUB_REPOSITORY" "workflow=.github/workflows/dashboard-image.yml" "event=$GITHUB_EVENT_NAME" \
            "ref=$GITHUB_REF" "sha=$SOURCE_SHA" "run_id=$GITHUB_RUN_ID" "run_attempt=$GITHUB_RUN_ATTEMPT" > bundle/.ana-build
          tar -C bundle --owner=0 --group=0 --numeric-owner -czf "ana-dashboard-app-${OUT_ID}.tar.gz" .
          sha256sum "ana-dashboard-app-${OUT_ID}.tar.gz" | tee "ana-dashboard-app-${OUT_ID}.tar.gz.sha256"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0" # node on the Contabo VPS vmi3693936 (observed 2026-10-27, Jira ANA-42 comment 18133)
      - name: Access gate of the native bundle under Node 24
        shell: bash
        run: |
          set -euo pipefail
          AUD=$(printf 'a%.0s' $(seq 64))
          expect() { [ "$1" = "$2" ] || { echo "FAIL: $3 -> $1, expected $2"; exit 1; }; echo "ok: $3 -> $1"; }
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $1" "http://127.0.0.1:3410$2"; }
          mkdir -p run && tar -xzf "ana-dashboard-app-${OUT_ID}.tar.gz" -C run
          # as dyai-ana-dashboard.service starts it: pinned environment + credential file read with --env-file. The file
          # also tries to switch to loopback mode on all interfaces; the pinned environment must win.
          printf 'CF_ACCESS_TEAM_DOMAIN=https://ci.cloudflareaccess.com\nCF_ACCESS_AUD=%s\nANA_ALLOWED_EMAILS=a@example.test\nANA_ACCESS_MODE=loopback\nHOSTNAME=0.0.0.0\n' "$AUD" > dashboard_env
          # prove the server runs on Node 24.22, not just that a node 24 is on PATH: pin the binary, then check the
          # executable of the process that owns the listening socket
          NODE="$(readlink -f "$(command -v node)")"
          [ "$("$NODE" --version)" = v24.22.0 ] || { echo "FAIL: $NODE is $("$NODE" --version), expected v24.22.0"; exit 1; }
          (cd run && env NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 HOSTNAME=127.0.0.1 PORT=3410 ANA_ACCESS_MODE=cloudflare ANA_CONTAINER=1 \
            "$NODE" --env-file=../dashboard_env server.js > ../native.log 2>&1 &)
          for _ in $(seq 30); do [ "$(code localhost /api/healthz)" = 200 ] && break; sleep 1; done
          [ "$(code localhost /api/healthz)" = 200 ] || { cat native.log; exit 1; }
          pid="$(ss -ltnpH 'sport = :3410' | sed -n 's/.*pid=\([0-9]*\),.*/\1/p' | head -1)"
          [ -n "$pid" ] || { echo "FAIL: no process owns 127.0.0.1:3410"; exit 1; }
          expect "$(readlink -f "/proc/$pid/exe")" "$NODE" "executable of the server process (pid $pid, $("$NODE" --version))"
          for host in localhost ana.dyai.cloud; do
            for p in / /pulse/social/instagram /api/social/instagram /api/work; do
              expect "$(code "$host" "$p")" 401 "native bundle, Host $host, no assertion, $p"
            done
          done
          expect "$(code localhost /api/healthz)" 200 "native bundle health check"
          ss -ltn | awk '$4 ~ /:3410$/ {print $4}' | grep -qx '127.0.0.1:3410'
          pkill -f '^next-server' || true # Next renames its process title
      - uses: actions/upload-artifact@v4
        with:
          name: ana-dashboard-${{ env.OUT_ID }}
          # only the native bundle: release.sh and fetch-release.sh install ana-dashboard-app-<sha>.tar.gz; the docker image
          # is built and tested above but not uploaded (~115 MB per run, unused; artifact storage quota, 2026-11-03)
          path: |
            ana-dashboard-app-${{ env.OUT_ID }}.tar.gz
            ana-dashboard-app-${{ env.OUT_ID }}.tar.gz.sha256
          if-no-files-found: error # the v4 default only warns
          retention-days: ${{ env.RETENTION_DAYS }}
