name: dashboard-image

# LIVE-01: builds the production container image of apps/dashboard on amd64 (the VPS is too loaded to build),
# proves the access gate inside the real container, and keeps the image as a workflow artifact
# (ana-dashboard-<sha>.tar.gz) for the operator to load on the VPS. No registry, no secrets, no deploy step.
# Keep the push and pull_request path lists identical.
on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "deploy/ana-dashboard/**"
      - ".github/workflows/dashboard-image.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "deploy/ana-dashboard/**"
      - ".github/workflows/dashboard-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --platform linux/amd64 -t "ana-dashboard:${GITHUB_SHA}" apps/dashboard
      - name: Runtime settings (health check budget, init process)
        shell: bash
        run: |
          set -euo pipefail
          # the VPS shows multi-second `docker exec` latency under CPU steal: a 5 s health check timed out there
          docker inspect -f '{{json .Config.Healthcheck}}' "ana-dashboard:${GITHUB_SHA}" \
            | jq -e '.Timeout == 20000000000 and .StartPeriod == 90000000000 and .Interval == 30000000000 and .Retries == 3'
          # both services run under an init process that reaps exited health check and exec children
          touch deploy/ana-dashboard/dashboard.env deploy/ana-dashboard/tunnel.env
          config="$(ANA_RELEASE=ci docker compose -f deploy/ana-dashboard/compose.yml config --format json)"
          rm deploy/ana-dashboard/dashboard.env deploy/ana-dashboard/tunnel.env
          jq -e '.services.dashboard.init == true and .services.tunnel.init == true' <<<"$config"
          # cloudflared starts under the same init and hardening as in compose.yml
          docker run --rm --init --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            "$(jq -r .services.tunnel.image <<<"$config")" --version
      - name: Access gate inside the container
        shell: bash
        run: |
          set -euo pipefail
          AUD=$(printf 'a%.0s' $(seq 64))
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $2" "http://127.0.0.1:$1$3"; }
          wait_healthy() { for _ in $(seq 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' "$1")" = healthy ] && return 0; sleep 2; done; docker logs "$1"; return 1; }
          expect() { [ "$1" = "$2" ] || { echo "FAIL: $3 -> $1, expected $2"; exit 1; }; echo "ok: $3 -> $1"; }

          # the image without any Access settings: everything refused, even a spoofed loopback Host
          docker run -d --name bare -p 127.0.0.1:3001:3000 "ana-dashboard:${GITHUB_SHA}"
          wait_healthy bare
          for host in localhost 127.0.0.1 ana.dyai.cloud; do
            expect "$(code 3001 "$host" /)" 503 "no Access settings, Host $host, page"
            expect "$(code 3001 "$host" /api/social/instagram)" 503 "no Access settings, Host $host, social API"
          done

          # cloudflare mode under the production container constraints of deploy/ana-dashboard/compose.yml
          docker run -d --name cf -p 127.0.0.1:3002:3000 --init --read-only --tmpfs /tmp --tmpfs /app/.next/cache \
            --cap-drop ALL --security-opt no-new-privileges:true -e ANA_ACCESS_MODE=cloudflare \
            -e CF_ACCESS_TEAM_DOMAIN=https://ci.cloudflareaccess.com -e CF_ACCESS_AUD="$AUD" -e ANA_ALLOWED_EMAILS=a@example.test \
            "ana-dashboard:${GITHUB_SHA}"
          wait_healthy cf
          for p in / /pulse/social/instagram /api/social/instagram /api/work; do
            expect "$(code 3002 localhost "$p")" 401 "cloudflare mode, no assertion, $p"
          done
          expect "$(code 3002 localhost /api/healthz)" 200 "health check"
          expect "$(docker exec cf node -e 'process.stdout.write(require("fs").readFileSync("/proc/1/cmdline","utf8").split("\0")[0])')" /sbin/docker-init "PID 1 under --init"

          # any mode other than cloudflare is refused inside the container (it listens on all interfaces)
          port=3003
          for mode in open "" loopback; do
            docker run -d --name "mode$port" -p "127.0.0.1:$port:3000" -e "ANA_ACCESS_MODE=$mode" "ana-dashboard:${GITHUB_SHA}"
            wait_healthy "mode$port"
            expect "$(code "$port" localhost /)" 503 "ANA_ACCESS_MODE='$mode', spoofed loopback Host, page"
            expect "$(code "$port" localhost /api/social/instagram)" 503 "ANA_ACCESS_MODE='$mode', spoofed loopback Host, social API"
            port=$((port + 1))
          done

          docker inspect -f '{{.Config.User}}' "ana-dashboard:${GITHUB_SHA}" | grep -qx node
          docker rm -f bare cf mode3003 mode3004 mode3005
      - name: Save image
        shell: bash
        run: |
          set -euo pipefail
          docker save "ana-dashboard:${GITHUB_SHA}" | gzip -1 > "ana-dashboard-${GITHUB_SHA}.tar.gz"
          gunzip -t "ana-dashboard-${GITHUB_SHA}.tar.gz"
          sha256sum "ana-dashboard-${GITHUB_SHA}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ana-dashboard-${{ github.sha }}
          path: ana-dashboard-${{ github.sha }}.tar.gz
          retention-days: 30
