name: worker-instagram

# Runs the instagram-oauth worker's own checks (syntax + node:test suite over the real migration SQL).
# Keep the push and pull_request path lists identical.
on:
  push:
    branches: [main]
    paths:
      - "workers/instagram-oauth/**"
      - ".github/workflows/worker-instagram.yml"
  pull_request:
    paths:
      - "workers/instagram-oauth/**"
      - ".github/workflows/worker-instagram.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/instagram-oauth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json engines: node >= 22.13 (node:sqlite unflagged)
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: workers/instagram-oauth/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
