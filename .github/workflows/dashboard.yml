name: dashboard

# Every root-level input that changes how the dashboard is built or tested must be listed here:
# the app itself, the root package.json + scripts behind `npm run dev/check/e2e`, the Node
# version (.nvmrc, read by setup-node below) and this workflow. Keep the push and pull_request lists identical.
on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "package.json"
      - "scripts/**"
      - ".nvmrc"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "package.json"
      - "scripts/**"
      - ".nvmrc"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      # test the PR head itself, not GitHub's synthetic merge commit (GITHUB_SHA on pull_request)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked-out source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "event=${GITHUB_EVENT_NAME} event_sha=${GITHUB_SHA} source_sha=${SOURCE_SHA} checked_out=${actual}"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$actual" == "$SOURCE_SHA" ]] || { echo "::error::checked out ${actual}, expected ${SOURCE_SHA}"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # ANA-5 AC9: the browser bundle must not contain a Jira credential, its variable names or a Basic auth header
      # ANA-38 AC9: nor the Instagram worker key, SOCIAL_IG_* names, a Bearer header or the worker internal path
      - run: npm run scan:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # the e2e build ran with the fake Jira token in its environment: that value must not appear in the browser bundle
      - run: npm run scan:bundle
        env:
          JIRA_API_TOKEN: e2e-fake-token
          SOCIAL_IG_INTERNAL_READ_KEY: e2e-fake-social-key
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/dashboard/test-results
          retention-days: 7
