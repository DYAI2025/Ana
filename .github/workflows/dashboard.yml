name: dashboard

# Every root-level input that changes how the dashboard is built or tested must be listed here:
# the app itself, the root package.json + scripts behind `npm run dev/check/e2e`, the Node
# version (.nvmrc, read by setup-node below) and this workflow. Keep the push and pull_request lists identical.
on:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "package.json"
      - "scripts/**"
      - ".nvmrc"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "package.json"
      - "scripts/**"
      - ".nvmrc"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

env:
  # the commit every job checks out, tests and names its outputs after: the PR head on pull_request (not GitHub's test
  # merge with the base), the pushed commit on push and workflow_dispatch. A PR run therefore does not test the merge
  # result; that the head contains the current base is checked at merge readiness (docs/delivery/DRS.md).
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Checked-out commit is SOURCE_SHA
        shell: bash
        run: |
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo "FAIL: HEAD is $(git rev-parse HEAD), expected $SOURCE_SHA"; exit 1; }
          echo "source $SOURCE_SHA tree $(git rev-parse 'HEAD^{tree}')"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # ANA-5 AC9: the browser bundle must not contain a Jira credential, its variable names or a Basic auth header
      # ANA-38 AC9: nor the Instagram worker key, SOCIAL_IG_* names, a Bearer header or the worker internal path
      # ANA-35 AC13: nor the Brain token, its variable name or a Brain token shape
      - run: npm run scan:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # the e2e build ran with the fake Jira token in its environment: that value must not appear in the browser bundle
      - run: npm run scan:bundle
        env:
          JIRA_API_TOKEN: e2e-fake-token
          SOCIAL_IG_INTERNAL_READ_KEY: e2e-fake-social-key
          BRAIN_API_TOKEN: e2e-fake-brain-token
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/dashboard/test-results
          retention-days: 7
