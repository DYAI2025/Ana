# /etc/nginx/sites-available/mcp.ana.dyai.cloud — bootstrap for the first certificate (README.md section 4, step M4).
# Port 80 only: answers the Let's Encrypt HTTP-01 challenge and nothing else. Replaced by
# nginx-mcp.ana.dyai.cloud.conf as soon as certbot has written /etc/letsencrypt/live/mcp.ana.dyai.cloud/.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.ana.dyai.cloud;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
