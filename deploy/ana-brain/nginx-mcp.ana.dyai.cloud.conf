# /etc/nginx/sites-available/mcp.ana.dyai.cloud — ANA Brain MCP on the Contabo VPS vmi3693936 (README.md section 4).
# DNS-only A record (not proxied by Cloudflare) to this host; Let's Encrypt certificate from certbot --webroot.
# Install this file only after the certificate exists; until then nginx-mcp.ana.dyai.cloud.acme.conf serves port 80.
# Only MCP, OAuth and health are exposed. /projection, Qdrant, Ollama and the filesystem are never reachable here.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.ana.dyai.cloud;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 24.04 ships nginx 1.24: the `http2 on;` directive needs 1.25.1 (check-nginx.sh tests this parser)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.ana.dyai.cloud;

    ssl_certificate /etc/letsencrypt/live/mcp.ana.dyai.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.ana.dyai.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    # Bearer keys and OAuth codes travel in headers/bodies/query strings: never log this host.
    access_log off;
    error_log /var/log/nginx/mcp.ana.dyai.cloud.error.log crit;
    client_max_body_size 512k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;

    location = /mcp        { proxy_pass http://127.0.0.1:8790; }
    location = /authorize  { proxy_pass http://127.0.0.1:8790; }
    location = /token      { proxy_pass http://127.0.0.1:8790; }
    location = /register   { proxy_pass http://127.0.0.1:8790; }
    location = /healthz    { proxy_pass http://127.0.0.1:8790; }
    location ^~ /.well-known/ { proxy_pass http://127.0.0.1:8790; }

    # The dashboard on this host reads /projection over loopback (BRAIN_API_URL=http://127.0.0.1:8790).
    location = /projection { deny all; }
    location / { return 404; }
}
