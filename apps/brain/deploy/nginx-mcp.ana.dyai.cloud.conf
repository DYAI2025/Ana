# ANA Brain MCP — public entry point. Only MCP + OAuth + health are exposed; /projection is internal only.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.ana.dyai.cloud;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.ana.dyai.cloud;

    # ssl_certificate /etc/letsencrypt/live/mcp.ana.dyai.cloud/fullchain.pem; # managed by Certbot
    # ssl_certificate_key /etc/letsencrypt/live/mcp.ana.dyai.cloud/privkey.pem; # managed by Certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Bearer keys and OAuth codes travel in headers/bodies/query strings: never log this host.
    access_log off;
    error_log /var/log/nginx/mcp.ana.dyai.cloud.error.log crit;
    client_max_body_size 512k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;

    location = /mcp        { proxy_pass http://127.0.0.1:8790; }
    location = /authorize  { proxy_pass http://127.0.0.1:8790; }
    location = /token      { proxy_pass http://127.0.0.1:8790; }
    location = /register   { proxy_pass http://127.0.0.1:8790; }
    location = /revoke     { proxy_pass http://127.0.0.1:8790; }
    location = /healthz    { proxy_pass http://127.0.0.1:8790; }
    location ^~ /.well-known/ { proxy_pass http://127.0.0.1:8790; }

    # The dashboard reads /projection server-side over the internal network only.
    location = /projection { deny all; }
    location / { return 404; }
}
